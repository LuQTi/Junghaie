<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Junghaie U15 Spiele</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #111;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .game {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .date {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .teams {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 18px;
    }

    .score {
      font-weight: bold;
      white-space: nowrap;
    }

    .league {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    .error {
      background: #fff0f0;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<main>

  <h1>🏒 Kölner Junghaie U15</h1>

  <div id="games">
    Spiele werden geladen ...
  </div>

</main>

<script>
async function loadGames() {
  const container = document.getElementById("games");

  try {
    const response = await fetch(
      "./data/games.json?" + Date.now()
    );

    if (!response.ok) {
      throw new Error(
        "games.json konnte nicht geladen werden."
      );
    }

    const games = await response.json();

    if (!Array.isArray(games) || games.length === 0) {
      container.innerHTML =
        "<p>Keine Spiele gefunden.</p>";

      return;
    }

    container.innerHTML = "";

    for (const game of games) {
      const element =
        document.createElement("div");

      element.className = "game";

      const score =
        game.homeScore !== null &&
        game.awayScore !== null
          ? `${game.homeScore} : ${game.awayScore}`
          : "–";

      const time =
        game.time
          ? ` · ${game.time} Uhr`
          : "";

      element.innerHTML = `
        <div class="date">
          ${escapeHtml(game.date)}${time}
        </div>

        <div class="teams">
          <span>
            ${escapeHtml(game.home)}
          </span>

          <span class="score">
            ${escapeHtml(score)}
          </span>

          <span>
            ${escapeHtml(game.away)}
          </span>
        </div>

        <div class="league">
          ${escapeHtml(game.league || "U15")}
        </div>
      `;

      container.appendChild(element);
    }

  } catch (error) {
    console.error(error);

    container.innerHTML = `
      <div class="error">
        Die Spiele konnten nicht geladen werden.
      </div>
    `;
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadGames();
</script>

</body>
</html>
