<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kölner Junghaie – Spiele</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 8px; }
    .meta { color: #666; margin-bottom: 24px; }
    .game { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin: 10px 0; }
    .teams { font-size: 1.05rem; font-weight: 600; }
    .date { color: #666; margin-bottom: 5px; }
    .league { display: inline-block; margin-top: 8px; font-size: .85rem; color: #555; }
  </style>
</head>
<body>
  <h1>Kölner Junghaie – Spiele</h1>
  <div class="meta" id="meta">Lade Spieldaten …</div>
  <main id="games"></main>

<script>
async function main() {
  const res = await fetch('./data/games.json');
  if (!res.ok) throw new Error('games.json konnte nicht geladen werden.');
  const data = await res.json();

  document.querySelector('#meta').textContent =
    data.games.length + ' Spiele · zuletzt aktualisiert ' +
    new Date(data.generatedAt).toLocaleString('de-DE');

  const root = document.querySelector('#games');

  for (const game of data.games) {
    const el = document.createElement('article');
    el.className = 'game';

    const date = new Date(game.datetime);
    const when = isNaN(date) ? `${game.date} ${game.time ?? ''}` :
      date.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });

    const score =
      Number.isFinite(game.homeScore) && Number.isFinite(game.awayScore)
        ? ` · ${game.homeScore}:${game.awayScore}`
        : '';

    el.innerHTML = `
      <div class="date">${when}${score}</div>
      <div class="teams">${escapeHtml(game.home)} – ${escapeHtml(game.away)}</div>
      <div class="league">${escapeHtml(game.league)}</div>
    `;
    root.appendChild(el);
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

main().catch(err => {
  document.querySelector('#meta').textContent = err.message;
});
</script>
</body>
</html>
