name: Update Junghaie Spiele, Ergebnisse und Tabelle

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-junghaie-data:
    name: Junghaie Daten aktualisieren
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Spiele, Ergebnisse und Tabelle abrufen
        run: npm run scrape

      - name: Spiele anzeigen
        run: cat data/games.json

      - name: Ergebnisse anzeigen
        run: cat data/results.json

      - name: Tabelle anzeigen
        run: cat data/standings.json

      - name: Aktualisierte Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update Junghaie Spiele, Ergebnisse und Tabelle"
            git push
          fi
